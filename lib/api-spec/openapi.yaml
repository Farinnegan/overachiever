openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rep-training
    description: Opt-in, anonymous pose-landmark examples for improving repetition counting
paths:
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      responses:
        "200":
          description: Authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      operationId: beginBrowserLogin
      responses:
        "302":
          description: Redirect to sign in
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      responses:
        "302":
          description: Complete sign in
  /logout:
    get:
      operationId: logoutBrowserSession
      responses:
        "302":
          description: Sign out
  /mobile-auth/token-exchange:
    post:
      operationId: exchangeMobileAuthorizationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
  /mobile-auth/logout:
    post:
      operationId: logoutMobileSession
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /rep-training/videos:
    get:
      operationId: listTrainingVideos
      summary: List signed-in user's private training clips
      responses:
        "200":
          description: Clips, including incomplete uploads
          content:
            application/json:
              schema:
                type: object
                properties:
                  videos:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrainingVideo"
                required: [videos]
  /rep-training/videos/uploads:
    post:
      operationId: requestTrainingVideoUpload
      summary: Reserve a private clip upload after explicit video consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingVideoInput"
      responses:
        "201":
          description: Upload reserved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  uploadURL: { type: string }
                required: [id, uploadURL]
  /rep-training/videos/{id}/complete:
    post:
      operationId: completeTrainingVideoUpload
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      responses:
        "200":
          description: Uploaded clip verified and saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingVideo"
  /rep-training/videos/{id}/content:
    get:
      operationId: getTrainingVideoContent
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      responses:
        "200":
          description: Private video content; supports range requests
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /rep-training/videos/{id}:
    delete:
      operationId: deleteTrainingVideo
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      responses:
        "200":
          description: Clip and stored file deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                required: [deleted]
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /rep-training/examples:
    get:
      operationId: listRepTrainingExamples
      tags: [rep-training]
      summary: List this contributor's own training examples
      parameters:
        - name: X-Contributor-Token
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The examples associated with this anonymous device token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepTrainingExamplesResponse"
        "400":
          description: Invalid contributor token
    post:
      operationId: createRepTrainingExample
      tags: [rep-training]
      summary: Save one explicitly labeled pose sequence
      parameters:
        - name: X-Contributor-Token
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepTrainingExampleInput"
      responses:
        "201":
          description: Example accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepTrainingExampleReceipt"
        "400":
          description: Invalid contribution
        "429":
          description: The contributor has reached the storage limit
    delete:
      operationId: deleteRepTrainingExamples
      tags: [rep-training]
      summary: Delete this contributor's previously shared examples
      parameters:
        - name: X-Contributor-Token
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: All examples associated with this token were deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepTrainingDeleteReceipt"
        "400":
          description: Invalid contributor token
components:
  parameters:
    TrainingVideoId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: [string, "null"], format: email }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        profileImageUrl: { type: [string, "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1, format: uri }
        state: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    TrainingVideoInput:
      type: object
      required: [consent, exercise, expectedReps, countedReps, placement, durationMs, size, contentType]
      properties:
        consent: { type: boolean, const: true }
        exercise: { type: string, enum: [squat, push-up] }
        expectedReps: { type: integer, minimum: 0, maximum: 100 }
        countedReps: { type: integer, minimum: 0, maximum: 100 }
        placement: { type: string, enum: [floor, body-level, other] }
        durationMs: { type: integer, minimum: 1000, maximum: 15000 }
        size: { type: integer, minimum: 1, maximum: 20971520 }
        contentType: { type: string, enum: [video/mp4, video/webm] }
    TrainingVideo:
      type: object
      required: [id, exercise, expectedReps, countedReps, placement, durationMs, size, contentType, ready, createdAt]
      properties:
        id: { type: string, format: uuid }
        exercise: { type: string, enum: [squat, push-up, bicep-curl] }
        expectedReps: { type: integer }
        countedReps: { type: integer }
        placement: { type: string, enum: [floor, body-level, other] }
        durationMs: { type: integer }
        size: { type: integer }
        contentType: { type: string }
        ready: { type: boolean }
        createdAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RepTrainingLandmark:
      type: object
      additionalProperties: false
      properties:
        index:
          type: integer
          enum: [11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28]
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        visibility:
          type: number
          minimum: 0
          maximum: 1
      required: [index, x, y, visibility]
    RepTrainingPoseFrame:
      type: object
      additionalProperties: false
      properties:
        offsetMs:
          type: integer
          minimum: 0
          maximum: 12000
        phase:
          type: string
          enum: [stand, lower, bottom, return, unknown]
        landmarks:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/RepTrainingLandmark"
      required: [offsetMs, phase, landmarks]
    RepTrainingExampleInput:
      type: object
      additionalProperties: false
      properties:
        exercise:
          type: string
          enum: [squat, push-up]
        label:
          type: string
          enum: [correct, incorrect]
        consent:
          type: boolean
          enum: [true]
        source:
          type: string
          enum: [counted, missed]
        aspectRatio:
          type: number
          minimum: 0.2
          maximum: 5
        frames:
          type: array
          minItems: 3
          maxItems: 40
          items:
            $ref: "#/components/schemas/RepTrainingPoseFrame"
      required: [exercise, label, consent, source, aspectRatio, frames]
    RepTrainingExample:
      type: object
      properties:
        id:
          type: string
          format: uuid
        exercise:
          type: string
          enum: [squat, push-up, bicep-curl]
        label:
          type: string
          enum: [correct, incorrect]
        aspectRatio:
          type: number
        source:
          type: string
          enum: [counted, missed]
        frames:
          type: array
          items:
            $ref: "#/components/schemas/RepTrainingPoseFrame"
        createdAt:
          type: string
          format: date-time
      required: [id, exercise, label, source, aspectRatio, frames, createdAt]
    RepTrainingExamplesResponse:
      type: object
      properties:
        examples:
          type: array
          items:
            $ref: "#/components/schemas/RepTrainingExample"
        limit:
          type: integer
        remaining:
          type: integer
      required: [examples, limit, remaining]
    RepTrainingExampleReceipt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accepted:
          type: boolean
      required: [id, accepted]
    RepTrainingDeleteReceipt:
      type: object
      properties:
        deletedCount:
          type: integer
      required: [deletedCount]

