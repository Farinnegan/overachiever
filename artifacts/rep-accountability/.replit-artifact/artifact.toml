kind = "web"
previewPath = "/"
title = "Rep Accountability"
description = "A mobile-first exercise accountability app that uses a phone camera for on-device movement recognition and repetition counting, while tracking completed workouts and consistency."
version = "1.0.0"
id = "artifacts/rep-accountability"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25133

[services.development]
run = "pnpm --filter @workspace/rep-accountability run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rep-accountability", "run", "build" ]
serve = "static"
publicDir = "artifacts/rep-accountability/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25133"
BASE_PATH = "/"
